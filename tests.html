<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Guru Nanak Map - Regression Test Suite</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body {
            background-color: #2B2118;
            color: #FBF4E3;
            font-family: Georgia, 'Courier New', monospace;
            padding: 40px;
        }
        h1 {
            color: #C1791F;
            border-bottom: 2px solid #5A4C3B;
            padding-bottom: 10px;
        }
        .test-container {
            background: #1A130D;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #5A4C3B;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-log {
            margin: 10px 0;
            padding-left: 15px;
            border-left: 3px solid #5A4C3B;
            line-height: 1.5;
        }
        .pass { 
            color: #2ecc71; 
            border-left-color: #2ecc71; 
        }
        .fail { 
            color: #e74c3c; 
            border-left-color: #e74c3c; 
        }
        .info { 
            color: #3498db; 
            border-left-color: #3498db; 
        }
        .summary {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #C1791F;
            font-size: 1.2em;
            font-weight: bold;
        }
        
        #mock-dom-wrapper {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1200px;
            height: 800px;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <div class="test-container">
        <h1>Engineering Division: Automated Regression Suite</h1>
        <p>Validating Udasis dataset, Leaflet map initialization, Audio engine, Accessibility, and WCAG AA contrast.</p>
        <div id="test-output"></div>
    </div>

    <!-- MOCK DOM STRUCTURE -->
    <div id="mock-dom-wrapper">
        <div id="splash-screen">
            <button id="enter-btn">Enter Journey</button>
        </div>
        <div id="app-container" class="hidden">
            <header class="app-header">
                <button id="ambient-toggle" class="audio-btn pause">
                    <span class="audio-icon-play">Play</span>
                    <span class="audio-icon-pause hidden">Pause</span>
                </button>
                <input type="range" id="volume-slider" min="0" max="1" value="0.3">
            </header>
            <div id="main">
                <aside id="sidebar">
                    <button id="showAllBtn">Show all five journeys</button>
                    <div id="udasiButtons"></div>
                    <div id="placeList"></div>
                </aside>
                <div id="mapWrap">
                    <div id="map" style="width: 100%; height: 100%;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Application Logic -->
    <script src="app.js"></script>

    <!-- TEST RUNNER SUITE -->
    <script>
        const output = document.getElementById("test-output");
        let testsPassed = 0;
        let testsFailed = 0;

        function log(message, type) {
            const el = document.createElement("div");
            el.className = `test-log ${type}`;
            const badge = type === 'pass' ? '[PASS]' : type === 'fail' ? '[FAIL]' : '[INFO]';
            el.innerHTML = `<strong>${badge}</strong> ${message}`;
            output.appendChild(el);
            if (type === 'pass') testsPassed++;
            if (type === 'fail') testsFailed++;
        }

        function runTests() {
            log("Starting Regression Test Suite...", "info");

            // Test 1: UDASIS Data Integrity
            try {
                if (typeof UDASIS !== 'undefined' && Array.isArray(UDASIS) && UDASIS.length === 5) {
                    let totalPlaces = UDASIS.reduce((acc, u) => acc + u.places.length, 0);
                    if (totalPlaces === 39) {
                        log(`UDASIS dataset loaded correctly with 5 journeys and ${totalPlaces} historical sites.`, "pass");
                    } else {
                        log(`UDASIS place count mismatch: got ${totalPlaces}, expected 39.`, "fail");
                    }
                } else {
                    log("UDASIS global array missing or incomplete.", "fail");
                }
            } catch (e) {
                log("UDASIS dataset test threw exception: " + e.message, "fail");
            }

            // Test 2: Icon Factory Output
            try {
                const iconNormal = makeIcon("#A6402C", false);
                const iconStart = makeIcon("#A6402C", true);
                if (iconNormal && iconNormal.options.html.includes("nanak-marker") && iconStart.options.html.includes("start-marker")) {
                    log("makeIcon() generates correct marker HTML classes and attributes.", "pass");
                } else {
                    log("makeIcon() output failed verification.", "fail");
                }
            } catch (e) {
                log("makeIcon test threw exception: " + e.message, "fail");
            }

            // Test 3: Leaflet Initialization & Render
            try {
                initMap();
                if (map && map.options) {
                    log("initMap() successfully instantiated Leaflet map.", "pass");
                } else {
                    log("initMap() failed to instantiate map.", "fail");
                }
            } catch (e) {
                log("initMap test threw exception: " + e.message, "fail");
            }

            // Test 4: Audio Engine Mute State Persistence
            try {
                sessionStorage.setItem('audioMuted', 'true');
                const isMuted = sessionStorage.getItem('audioMuted') === 'true';
                if (isMuted) {
                    log("sessionStorage accurately persists 'audioMuted' state.", "pass");
                } else {
                    log("sessionStorage failed to persist mute state.", "fail");
                }
                sessionStorage.removeItem('audioMuted');
            } catch (e) {
                log("Audio state persistence test threw exception: " + e.message, "fail");
            }

            // Test 5: Keyboard Accessibility & ARIA Attributes
            try {
                const sampleIconHtml = makeIcon("#A6402C", false).options.html;
                if (sampleIconHtml.includes('tabindex="0"') && sampleIconHtml.includes('role="button"')) {
                    log("Map markers include WCAG AA keyboard focus attributes (tabindex=0, role=button).", "pass");
                } else {
                    log("Map markers missing keyboard focus attributes.", "fail");
                }
            } catch (e) {
                log("Accessibility test threw exception: " + e.message, "fail");
            }

            // Test 6: WCAG AA Color Contrast Ratio Check
            try {
                function sRGBtoLinear(c) {
                    const v = c / 255;
                    return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
                }
                function relativeLuminance(r, g, b) {
                    return 0.2126 * sRGBtoLinear(r) + 0.7152 * sRGBtoLinear(g) + 0.0722 * sRGBtoLinear(b);
                }
                const L_ink = relativeLuminance(0x2B, 0x21, 0x18); // #2B2118
                const L_parchment = relativeLuminance(0xFB, 0xF4, 0xE3); // #FBF4E3
                const ratio = (Math.max(L_ink, L_parchment) + 0.05) / (Math.min(L_ink, L_parchment) + 0.05);
                
                if (ratio >= 4.5) {
                    log(`Manuscript theme contrast ratio: ${ratio.toFixed(2)}:1 — WCAG AA compliant (≥4.5:1).`, "pass");
                } else {
                    log(`Manuscript theme contrast ratio ${ratio.toFixed(2)}:1 fails WCAG AA.`, "fail");
                }
            } catch (e) {
                log("Contrast calculation threw exception: " + e.message, "fail");
            }

            // Summary
            const summary = document.createElement("div");
            summary.className = "summary";
            if (testsFailed === 0) {
                summary.style.color = "#2ecc71";
                summary.innerHTML = `Suite Complete: ALL GREEN (${testsPassed} Passed) — Project ready for deployment.`;
            } else {
                summary.style.color = "#e74c3c";
                summary.innerHTML = `Suite Complete: ${testsFailed} FAILURES DETECTED (${testsPassed} Passed).`;
            }
            output.appendChild(summary);
        }

        window.addEventListener("load", () => {
            setTimeout(runTests, 200);
        });
    </script>
</body>
</html>
